name: DeployIntel Release Tracker
on:
  release:
    types: [published]

jobs:
  notify-deployintel:
    runs-on: ubuntu-latest
    steps:
      - name: Notify DeployIntel of new release
        run: |
          curl -s -X POST "https://1959-197-15-5-235.ngrok-free.app/api/v1/releases" \
            -H "Authorization: Bearer ${{ secrets.DEPLOYINTEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "projectId": "15e8a70f-c03d-44be-9922-c03031195da0",
                  "versionNumber": "${{ github.ref_name }}",
                  "commitSha": "${{ github.sha }}",
                  "branch": "${{ github.ref_name }}",
                  "tag": "${{ github.ref_name }}",
                  "environment": "PRODUCTION"
                }'
